name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', '.github/dependabot.yml']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', '.github/dependabot.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event name is in the group: a push never cancels a dispatched e2e run.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # A skipped draft run must not cancel a real run (bug #179): only real runs cancel older ones.
  cancel-in-progress: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}

jobs:
  # `rust` is the only check branch protection requires (#409): two PRs green alone once broke `tsc` on main together
  # (#402). It gates the four checks below, which run side by side to halve the wait; it fails unless every one
  # succeeded, since a skipped or cancelled job would pass a required check.
  rust:
    # No CI on draft PRs: it runs when the PR is ready (ready_for_review) and on pushes to main.
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [cargo, client, build, mcp, changes, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$RESULTS" = 'success success success success'
        env:
          RESULTS: ${{ needs.cargo.result }} ${{ needs.client.result }} ${{ needs.build.result }} ${{ needs.mcp.result }}
      # Coverage must succeed whenever the diff touches Rust (#1181); it is skipped only when it had no reason to run.
      - run: test "$COVERAGE" = success || { test "$COVERAGE" = skipped && test "$RUST" != true; }
        env:
          COVERAGE: ${{ needs.coverage.result }}
          RUST: ${{ needs.changes.outputs.rust }}

  cargo:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all --locked

  # The client's unit tests, on the wasm package, cached like in the `wasm` job. Five shards run in parallel, dealt by file size (scripts/unit-shard.ts: --shard cuts by file count, not by cost), each writes a blob
  # report with its coverage; the `client` job below merges them and checks the 100 % gate once (#1079).
  client-shard:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - id: wasm-cache
        uses: actions/cache@v4
        with:
          path: crates/edgefall-wasm/pkg
          key: wasm-pkg-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/edgefall-wasm/**', 'crates/edgefall-core/**') }}
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: rustup target add wasm32-unknown-unknown
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # wasm-opt from the Actions cache, so a GitHub release outage cannot fail wasm-pack (#1648).
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/wasm-opt
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: wasm-pack build crates/edgefall-wasm --target web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: client/package.json
      - run: bun install --frozen-lockfile
        working-directory: client
      # The default reporter prints each failing test by name next to the blob (the blob reporter alone prints nothing on a failure).
      - run: bunx vitest run $(bun run scripts/unit-shard.ts ${{ matrix.shard }} 5) --reporter=default --reporter=blob --outputFile.blob=reports/blob-${{ matrix.shard }}-5.json --coverage
        working-directory: client
        env:
          VITEST_SHARD: '1'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: client/reports/blob-${{ matrix.shard }}-5.json
          retention-days: 1

  # Merges the five blob reports: every test ran, and the merged coverage meets the 100 % thresholds (decision #445).
  client:
    needs: client-shard
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: crates/edgefall-wasm/pkg
          key: wasm-pkg-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/edgefall-wasm/**', 'crates/edgefall-core/**') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: client/package.json
      - run: bun install --frozen-lockfile
        working-directory: client
      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: client/reports
          merge-multiple: true
      - run: bunx vitest --merge-reports=reports --coverage
        working-directory: client

  # The client's types and production build, on the same cached wasm package.
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: wasm-cache
        uses: actions/cache@v4
        with:
          path: crates/edgefall-wasm/pkg
          key: wasm-pkg-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/edgefall-wasm/**', 'crates/edgefall-core/**') }}
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: rustup target add wasm32-unknown-unknown
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # wasm-opt from the Actions cache, so a GitHub release outage cannot fail wasm-pack (#1648).
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/wasm-opt
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: wasm-pack build crates/edgefall-wasm --target web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: client/package.json
      - run: bun install --frozen-lockfile
        working-directory: client
      - run: bunx tsc --noEmit
        working-directory: client
      # The KTX2 encodes of the textures (#700), by the hash of each source: only a changed texture is encoded again.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ab-alone-ktx2
          key: ktx2-${{ hashFiles('client/textures/**', 'client/scripts/ktx2-textures.mjs', 'client/bun.lock') }}
          restore-keys: ktx2-
      # The download size budget of docs/specs/tech.md section 9 (#505), on the production build.
      - run: bunx vite build
        working-directory: client
      - run: bun run scripts/size-budget.mjs dist
        working-directory: client

  # The MCP server's tests (#252, #755): they build their own wasm package (nodejs target), so wasm-pack and the wasm
  # target are always needed here.
  mcp:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # wasm-opt from the Actions cache, so a GitHub release outage cannot fail wasm-pack (#1648).
      - uses: ./.github/actions/wasm-opt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: client/package.json
      - run: bun install --frozen-lockfile
        working-directory: mcp
      - run: bun run test
        working-directory: mcp
      # tsc follows the mcp imports into client/src, which needs the client's packages (#1404).
      - run: bun install --frozen-lockfile
        working-directory: client
      - run: bunx tsc --noEmit
        working-directory: mcp

  # On push to main, finds what changed since the last successful CI run on main (not just this push: a cancelled run
  # never tested its commits); on a ready PR, what the PR changes. A manual dispatch always runs everything. Only
  # coverage depends on the diff, `rust` always runs, so a skipped job never stands in for a check that mattered
  # (#258, CONTRIBUTING 6.4).
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      # Commits and trees only (#1493): `git diff --name-only` reads no blob, and a full clone of every branch (the proof
      # images of pr-screenshots too) once ran past the 5 minute timeout and cancelled the whole run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rust=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            base=$(gh run list --workflow ci.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha')
            if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              files=$(git diff --name-only "$base" "$GITHUB_SHA")
              echo "changed since $base:"; echo "$files"
              printf '%s\n' "$files" | grep -qE '^(crates/|Cargo\.|\.github/workflows/ci\.yml)' || rust=false
            fi
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The checkout is the merge commit: its first parent is the base, so the diff is the PR's own change.
            files=$(git diff --name-only HEAD^1 HEAD)
            echo "changed by the PR:"; echo "$files"
            printf '%s\n' "$files" | grep -qE '^(crates/|Cargo\.|\.github/workflows/ci\.yml)' || rust=false
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  # Side by side with the checks, not after them: on main it no longer adds its time to theirs.
  coverage:
    if: needs.changes.outputs.rust == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --locked --fail-under-lines 100 --fail-under-regions 100 --show-missing-lines -- --test-threads=1

  # The e2e suite runs only on a dispatch (`gh workflow run ci.yml --ref main`), never on a PR or a push: e2e-hourly.yml
  # dispatches it every hour when main moved (#1433, which replaces the "full suite before every merge" of #445).
  # The WASM package is built once here and shared with the e2e shards as an artifact (#258).
  wasm:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: wasm-cache
        uses: actions/cache@v4
        with:
          path: crates/edgefall-wasm/pkg
          key: wasm-pkg-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/edgefall-wasm/**', 'crates/edgefall-core/**') }}
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # wasm-opt from the Actions cache, so a GitHub release outage cannot fail wasm-pack (#1648).
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/wasm-opt
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: wasm-pack build crates/edgefall-wasm --target web
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: crates/edgefall-wasm/pkg
          retention-days: 1

  # Software WebGL on a 4-vCPU runner starves two workers (#216), so each shard runs one worker and the shards run in
  # parallel on their own runners: the wall clock is the slowest shard.
  # --shard does not cut the test list into four runs: client/scripts/shard-reporter.ts deals the tests to the shards back
  # and forth (1, 2, 3, 4, 4, 3, 2, 1, ...), so the slow tests of one spec file spread over every shard (#333).
  e2e:
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    env:
      # The wasm package comes from the wasm job: the dev server must not rebuild it.
      E2E_SKIP_WASM_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: crates/edgefall-wasm/pkg
      # bun installs and runs the scripts (decision #243), node still runs vite and Playwright.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: client/package.json
      - run: bun install --frozen-lockfile
        working-directory: client
      - id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: client
      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
        working-directory: client
      # The KTX2 encodes of the textures (#700), by the hash of each source: only a changed texture is encoded again.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ab-alone-ktx2
          key: ktx2-${{ hashFiles('client/textures/**', 'client/scripts/ktx2-textures.mjs', 'client/bun.lock') }}
          restore-keys: ktx2-
      # --no-deps: chromium-serial depends on chromium, and Playwright refuses to shard a project others depend on (#1436).
      # One worker per runner keeps the frame-time check alone anyway.
      - run: bun run e2e --no-deps --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        working-directory: client
      # The 10 slowest tests of this shard, in the run summary even when the shard fails (#323).
      - if: always()
        run: |
          echo "### Slowest e2e tests, shard ${{ matrix.shard }}/${{ strategy.job-total }}" >> "$GITHUB_STEP_SUMMARY"
          bun run scripts/slowest-tests.ts e2e-results.json >> "$GITHUB_STEP_SUMMARY"
        working-directory: client
      # The runner's timings of every test, kept on success too to rank the slow ones (#1436).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: client/e2e-results.json
          retention-days: 2
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 7

  # A red e2e on main must reach the owners (#1435): the hourly run is started by a bot, so nobody is notified by GitHub.
  e2e-alert:
    needs: e2e
    if: failure() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          title='Bug: the full e2e suite is red on main'
          open=$(gh issue list --state open --label bug --search "in:title \"$title\"" --json number --jq '.[0].number // ""')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Still red on $SHA: $RUN"
          else
            gh issue create --title "$title" --label bug --assignee TidyMaze,Varadiell --body "**Steps to reproduce**
          The hourly full e2e run on \`main\`, commit $SHA: $RUN (the failed specs are in the run's report).

          **What happens**
          The suite is red on \`main\`.

          **Expected once fixed**
          Green. Rule: revert at once, then fix (CONTRIBUTING 6.4)."
          fi
